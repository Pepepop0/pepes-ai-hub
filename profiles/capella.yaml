schema_version: 1
id: capella
name: Capella
ui:
  default_pet: hello-kitty
  default_theme: capella
description: >-
  RTX 5090 32 GB — perfil principal NSFW: chat multimodal uncensored de 27B e
  geração/edição de imagem com FLUX.2 Klein 9B FP8, alternados na mesma GPU.

hardware:
  os: windows
  gpu_vendor: nvidia
  min_vram_gb: 32
  recommended_vram_gb: 32
  # A real RTX 5090 reports 32607 MiB to nvidia-smi, 161 short of 32 GiB;
  # the 128 MiB the other profiles use would refuse the very card this
  # profile is for.
  vram_tolerance_mib: 256
  notes: >-
    Single RTX 5090 (32 GB, 32607 MiB reportados). Chat e imagem não ficam
    residentes juntos: a troca descarrega Ollama antes do FLUX e libera o
    ComfyUI ao terminar. RAM: 32 GB é o mínimo operacional, 64 GB o recomendado.
    Multi-GPU fora do escopo v0.1.

services:
  ollama: {enabled: true, port: 11434}
  open-webui: {enabled: true, port: 8080}
  comfyui: {enabled: true, port: 8188}

features:
  chat: true
  vision: true
  tools: true
  image_generation: true
  image_editing: true

models:
  chat:
    primary: ollama/qwen3_8_27b_uncensored_q5
    status: candidate
    alternatives: [ollama/qwen3_5_27b]
    params: {think: false, num_ctx: 16384}
  image:
    diffusion: comfyui/flux2_klein_9b_fp8
    text_encoder: comfyui/qwen_3_8b_fp8mixed_encoder
    vae: comfyui/flux2_small_decoder

workflows:
  # The distilled 9B runs at its native four steps. Image generation and edit
  # use the same pinned model set, but never share VRAM residency with Ollama.
  text_to_image: {manifest_id: flux2_klein_9b_t2i, size: 1024x1024, steps: 4}
  image_edit: {manifest_id: flux2_klein_9b_edit}

runtime:
  aggressive_vram_unload: true
  prefer_single_heavy_model_resident: true
  # Chat (27B Q5) and FLUX.2 Klein 9B alternate on the card: the image filter
  # unloads Ollama before each image and frees ComfyUI after it.
  exclusive_image_vram: true
  open_browser: true
