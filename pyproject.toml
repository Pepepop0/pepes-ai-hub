[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-stack"
version = "1.19.39"
description = "Windows/NVIDIA AI stack provisioner with a headless Linux Capella bench"
requires-python = ">=3.11"
dependencies = ["textual>=0.80", "PyYAML>=6.0", "httpx>=0.27", "psutil>=6.0", "platformdirs>=4.0", "pywebview==6.2.1; sys_platform == 'win32'", "zstandard==0.25.0; sys_platform == 'linux'"]

[project.optional-dependencies]
# Pillow and pydantic: the filter tests run code Open WebUI ships those for (the reference
# picture cleaning, and the filter's per-user Valves).
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "pillow>=10.0", "pydantic>=2.0"]
# The managed Open WebUI's native image extension runs inside Open WebUI (FastAPI, SQLAlchemy);
# its backend tests need them and are skipped without. Install them in a throwaway
# environment, never in the Hub's own.
native-test = ["pytest>=8.0", "pillow>=10.0", "pydantic>=2.0", "fastapi>=0.115", "sqlalchemy>=2.0", "httpx>=0.27"]
# The Windows release build. Pinned exactly: the build must be reproducible.
build = ["pyinstaller==6.22.3"]

[project.scripts]
local-ai-stack = "local_ai_stack.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency injection is written as a default argument.
"assets/open-webui/pepito_native.py" = ["B008"]
