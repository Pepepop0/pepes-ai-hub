schema_version: 1
id: capella
name: Capella
ui:
  default_pet: hello-kitty
  default_theme: capella
description: RTX 5090 32 GB — single GPU profile.

hardware:
  os: windows
  gpu_vendor: nvidia
  min_vram_gb: 32
  recommended_vram_gb: 32
  vram_tolerance_mib: 128
  notes: Single RTX 5090. Multi-GPU fora do escopo v0.1.

services:
  ollama: {enabled: true, port: 11434}
  open-webui: {enabled: true, port: 8080}
  comfyui: {enabled: true, port: 8188}

features:
  chat: true
  vision: true
  tools: true
  image_generation: true
  image_editing: true

models:
  chat:
    primary: ollama/qwen3_5_9b
    status: candidate
    alternatives: []
  image:
    diffusion: comfyui/flux2_klein_fp8
    text_encoder: comfyui/qwen_3_4b_encoder
    vae: comfyui/flux2_vae

workflows:
  text_to_image: {manifest_id: flux2_klein_t2i}
  image_edit: {manifest_id: flux2_klein_edit}

runtime:
  aggressive_vram_unload: false
  prefer_single_heavy_model_resident: false
  open_browser: true
