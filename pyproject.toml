[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-stack"
version = "0.0.1"
description = "Windows/NVIDIA local AI stack provisioner"
requires-python = ">=3.11"
dependencies = ["textual>=0.80", "PyYAML>=6.0", "httpx>=0.27", "psutil>=6.0", "platformdirs>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
local-ai-stack = "local_ai_stack.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The shared contracts are named TestPhase, TestRunSpec and so on because that
# is what they are; pytest's default class pattern tries to collect them and
# warns on every import. Nothing in this suite is class-based.
python_classes = ["*TestCase"]

[tool.ruff]
line-length = 100
target-version = "py311"
