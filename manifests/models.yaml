# Model catalog.
#
# One canonical id per model: <provider>/<stable-name>, the key below joined to
# its provider section. Profiles reference these ids and nothing else — no URL,
# no hash, no filename, no install path ever appears in a profile.
#
# Nothing here resolves "latest". An Ollama model is pinned by an explicit
# name:tag, and a managed ComfyUI file is pinned by URL plus SHA-256; a file
# entry without both is declared but not installable, and resolves as
# not-installed rather than being fetched from somewhere unverified.
#
# `aliases` exist so an id written the old way still lands on the canonical
# entry. They are normalized on the way in and never become a second namespace.

schema_version: 1

ollama:
  # Digests are the short manifest digests published on ollama.com/library.
  # They are recorded for traceability and checked as a prefix of the full
  # digest the local Ollama reports, so a tag republished upstream is visible.
  hermes3_8b:
    kind: chat
    reference: hermes3:8b
    digest: 4f6b83f30b62
    aliases: [ollama/hermes3-8b]
    capabilities: {text: true, tools: true, vision: false}
    status: candidate

  qwen3_5_9b:
    kind: chat
    reference: qwen3.5:9b
    digest: 6488c96fa5fa
    aliases: [ollama/qwen3-5-9b]
    capabilities: {text: true, tools: true, vision: true}
    status: tested_chat_tool_calling_unreliable_for_image

  qwen3_8b:
    kind: chat
    reference: qwen3:8b
    digest: 500a1f067a9f
    aliases: [ollama/qwen3-8b]
    capabilities: {text: true, tools: true, vision: false}
    status: tested

comfyui:
  # The FLUX.2 Klein 4B set, as the ComfyUI tutorial for this model specifies
  # it. Each URL is pinned to a repository commit rather than to a branch, so
  # the identity of the bytes cannot change under us: /resolve/<commit>/ is
  # immutable where /resolve/main/ is not.
  #
  # Every SHA-256 below is the git-lfs oid recorded at that exact commit, read
  # twice by two independent routes — the model API with blobs, and the raw LFS
  # pointer at the pinned commit — and never by downloading the file. `version`
  # records the commit, so the pin is traceable from the spec alone.
  #
  # Filenames repeat across repositories, so each entry names its source
  # deliberately and none of them was matched by filename alone.

  # The distilled 4B, not the base 4B. black-forest-labs publishes both, and
  # flux-2-klein-base-4b-fp8.safetensors is a different file in a different
  # repository; the tutorial lists this one as the distilled variant.
  flux2_klein_fp8:
    kind: diffusion
    placement: diffusion_models
    filename: flux-2-klein-4b-fp8.safetensors
    url: https://huggingface.co/black-forest-labs/FLUX.2-klein-4b-fp8/resolve/5b4408e59397a4a37ccb46afe426d8ed86379441/flux-2-klein-4b-fp8.safetensors
    sha256: 97ed34fe0567e436200f2faee3939b88f2b5d99f8af2a4dc16532c4245c0ccb6
    size_bytes: 4070624520
    version: 5b4408e59397a4a37ccb46afe426d8ed86379441
    status: manually_tested

  qwen_3_4b_encoder:
    kind: text-encoder
    placement: text_encoders
    filename: qwen_3_4b.safetensors
    url: https://huggingface.co/Comfy-Org/flux2-klein-4B/resolve/5f526678002e43af5551dadb73ce2e8c91b43afe/split_files/text_encoders/qwen_3_4b.safetensors
    sha256: 6c671498573ac2f7a5501502ccce8d2b08ea6ca2f661c458e708f36b36edfc5a
    size_bytes: 8044982048
    version: 5f526678002e43af5551dadb73ce2e8c91b43afe
    status: manually_tested

  # Deliberately from flux2-dev, which is the repository the ComfyUI tutorial
  # names for this VAE. Comfy-Org/flux2-klein-4B ships a file with the very
  # same name that is NOT the same bytes — sha256 868fe7b3…, 336211292 bytes,
  # against d64f3a68… and 336213556 here. Do not "fix" this by swapping the
  # source: they are different artifacts that happen to share a filename.
  flux2_vae:
    kind: vae
    placement: vae
    filename: flux2-vae.safetensors
    url: https://huggingface.co/Comfy-Org/flux2-dev/resolve/ab9055628ea245000e610f2aa2c96f4746093546/split_files/vae/flux2-vae.safetensors
    sha256: d64f3a68e1cc4f9f4e29b6e0da38a0204fe9a49f2d4053f0ec1fa1ca02f9c4b5
    size_bytes: 336213556
    version: ab9055628ea245000e610f2aa2c96f4746093546
    status: manually_tested
