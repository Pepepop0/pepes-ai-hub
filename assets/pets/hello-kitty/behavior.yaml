schema_version: 1
id: hello-kitty

micro_animations:
  blink:
    enabled: true
    # Blinks often, and holds each one long enough to read at a 0.12s refresh.
    min_interval_ms: 900
    max_interval_ms: 2600
    min_duration_ms: 260
    max_duration_ms: 420
    double_blink_chance: 0.18

  jump:
    enabled: true
    # Hops often, stays up a while: nearly half of each hop is spent at the
    # top, so the character reads as floating rather than twitching.
    min_interval_ms: 1600
    max_interval_ms: 4000
    min_duration_ms: 900
    max_duration_ms: 1500
    min_height_rows: 1
    max_height_rows: 2
    hang_ratio: 0.46
    blink_convergence_chance: 0.30

render:
  # Blink swaps the drawing only where the asset supplies both versions. Every
  # other state keeps whatever frame its animation produces, so the semantic
  # animation stays in charge and blink only adds to it.
  variants:
    idle:
      open: base/open.txt
      closed: base/closed.txt
  anchor: bottom
  preserve_canvas_height: true
  # The art is drawn at 62x31 cells; the right rail is narrower than that, so
  # the braille bitmap is cropped to its ink and scaled down to fit. The files
  # on disk stay untouched at full resolution.
  crop_to_ink: true
  max_width: 31
  headroom_rows: 2
