schema_version: 1
workflows:
  flux2_klein_t2i:
    file: workflows/flux2-klein-t2i-api.json
    status: mapped_and_embedded
    # Every model this graph loads, by profile role. Nothing is implied: a role
    # missing here is a role the workflow will not wait for, and a role listed
    # here must resolve to an AVAILABLE model before the workflow is usable.
    models:
      required: [image.diffusion, image.text_encoder, image.vae]
      parameter: image.diffusion
    mapping:
      prompt: {node_id: "76", key: value}
      model: {node_id: "75:70", key: unet_name}
      width: {node_id: "75:68", key: value}
      height: {node_id: "75:69", key: value}
      steps: {node_id: "75:62", key: steps}
      seed: {node_id: "75:73", key: noise_seed}
  flux2_klein_edit:
    file: workflows/flux2-klein-edit-api.json
    status: TODO_export_and_map
    models:
      required: [image.diffusion, image.text_encoder, image.vae]
      parameter: image.diffusion
    mapping:
      image: TBD
      prompt: TBD
      model: TBD
      width: TBD
      height: TBD
      steps: TBD
      seed: TBD
