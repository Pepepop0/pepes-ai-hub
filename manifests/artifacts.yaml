# Pinned downloadable artifacts.
#
# Every entry names an exact upstream release. Nothing here resolves "latest":
# a version bump is an edit to this file, reviewed like any other change.
#
# The sha256 values come from the GitHub release API `digest` field for each
# asset, which is what the release publisher recorded. The downloader treats a
# present checksum as mandatory and discards bytes that do not match.
#
# Windows/amd64 only, matching the v0.1 target. Other platforms get their own
# entries when they are supported, not a substitution at runtime.

schema_version: 1

artifacts:
  # Ollama v0.33.2, published 2026-08-27, stable (not a prerelease).
  # Portable archive rather than OllamaSetup.exe: the installer writes to the
  # registry and the user PATH, which this project does not do.
  - id: ollama-windows-amd64
    component: ollama
    version: "0.33.2"
    url: https://github.com/ollama/ollama/releases/download/v0.33.2/ollama-windows-amd64.zip
    filename: ollama-windows-amd64.zip
    sha256: 2439cbea65310b1aadf7d8fc41d7faf5d033f920d42e00a476c58bf9bff6950e
    size_bytes: 1460134793

  # The Python the packaged Hub installs Open WebUI and ComfyUI with.
  #
  # A frozen build carries no usable interpreter of its own - its
  # sys.executable is the Hub itself - and the person running it may have no
  # Python installed at all. So the product provisions one, pinned like every
  # other artifact, into <root>/runtime/python and creates every managed
  # virtual environment from it. A source checkout keeps using its own venv.
  #
  # python-build-standalone 3.11.16, release 20260901, stable. The
  # `install_only` flavour is a plain relocatable CPython with venv and
  # ensurepip, not the python.org embeddable zip, which ships neither. 3.11
  # is the version the ComfyUI torch triple and Open WebUI are validated on.
  - id: python-windows-amd64
    component: python-runtime
    version: "3.11.16"
    url: https://github.com/astral-sh/python-build-standalone/releases/download/20260901/cpython-3.11.16+20260901-x86_64-pc-windows-msvc-install_only.tar.gz
    filename: cpython-3.11.16+20260901-x86_64-pc-windows-msvc-install_only.tar.gz
    sha256: 6be524fa6752af802146a4adc7d098565425b0b1c166e19a5a7a4c8cccb86bf6
    size_bytes: 47940627
