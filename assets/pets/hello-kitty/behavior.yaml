schema_version: 1
id: hello-kitty

micro_animations:
  blink:
    enabled: true
    min_interval_ms: 1800
    max_interval_ms: 4500
    min_duration_ms: 120
    max_duration_ms: 220
    double_blink_chance: 0.10

  jump:
    enabled: true
    min_interval_ms: 2500
    max_interval_ms: 6500
    min_duration_ms: 400
    max_duration_ms: 700
    min_height_rows: 1
    max_height_rows: 2
    blink_convergence_chance: 0.25

render:
  open_frame: base/open.txt
  closed_frame: base/closed.txt
  anchor: bottom
  preserve_canvas_height: true
  # The art is drawn at 62x31 cells; the right rail is narrower than that, so
  # the braille bitmap is cropped to its ink and scaled down to fit. The files
  # on disk stay untouched at full resolution.
  crop_to_ink: true
  max_width: 31
  headroom_rows: 2
