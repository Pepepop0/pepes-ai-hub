schema_version: 1
id: pepe
name: Pepe
ui:
  default_pet: claw
  default_theme: pepe
description: RTX 5070 12 GB — profile pessoal de referência.

hardware:
  os: windows
  gpu_vendor: nvidia
  min_vram_gb: 12
  recommended_vram_gb: 12
  vram_tolerance_mib: 128
  notes: Single GPU. VRAM apertada para LLM + FLUX simultâneos.

services:
  ollama: {enabled: true, port: 11434}
  open-webui: {enabled: true, port: 8080}
  comfyui: {enabled: true, port: 8188}

features:
  chat: true
  vision: true
  tools: true
  image_generation: true
  image_editing: true

models:
  chat:
    primary: ollama/hermes3_8b
    status: candidate
    alternatives: [ollama/qwen3_5_9b, ollama/qwen3_8b]
  image:
    diffusion: comfyui/flux2_klein_fp8
    text_encoder: comfyui/qwen_3_4b_encoder
    vae: comfyui/flux2_vae

workflows:
  text_to_image: {manifest_id: flux2_klein_t2i}
  image_edit: {manifest_id: flux2_klein_edit}

runtime:
  aggressive_vram_unload: true
  prefer_single_heavy_model_resident: true
  open_browser: true
